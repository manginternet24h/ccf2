<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện 6 hình</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 40px 20px; background: #f4f5f7; color: #1a1a1a; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 32px; animation: fadeDown .8s ease both; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }

  figure {
    margin: 0; background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    transition: transform .35s ease, box-shadow .35s ease;
    animation: fadeUp .7s ease both;
  }
  figure:nth-child(1) { animation-delay: .05s }
  figure:nth-child(2) { animation-delay: .15s }
  figure:nth-child(3) { animation-delay: .25s }
  figure:nth-child(4) { animation-delay: .35s }
  figure:nth-child(5) { animation-delay: .45s }
  figure:nth-child(6) { animation-delay: .55s }

  figure:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 14px 30px rgba(0,0,0,.18); }

  .frame { overflow: hidden; }
  figure img {
    width: 100%; height: 220px; object-fit: cover; display: block;
    transition: transform .6s ease, filter .6s ease;
  }
  figure:hover img { transform: scale(1.12); filter: saturate(1.2); }

  figcaption { padding: 12px 16px; font-size: 15px; transition: color .3s ease; }
  figure:hover figcaption { color: #0d6efd; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px) } to { opacity: 1; transform: none } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <h1>Thư viện 6 hình</h1>
  <div class="gallery">
    <figure><div class="frame"><img src="https://picsum.photos/id/1015/800/600" alt="Hình 1"></div><figcaption>Hình 1 — Sông núi</figcaption></figure>
    <figure><div class="frame"><img src="https://picsum.photos/id/1024/800/600" alt="Hình 2"></div><figcaption>Hình 2 — Chú gấu</figcaption></figure>
    <figure><div class="frame"><img src="https://picsum.photos/id/1043/800/600" alt="Hình 3"></div><figcaption>Hình 3 — Rừng cây</figcaption></figure>
    <figure><div class="frame"><img src="https://picsum.photos/id/1050/800/600" alt="Hình 4"></div><figcaption>Hình 4 — Nhà gỗ</figcaption></figure>
    <figure><div class="frame"><img src="https://picsum.photos/id/1039/800/600" alt="Hình 5"></div><figcaption>Hình 5 — Thác nước</figcaption></figure>
    <figure><div class="frame"><img src="https://picsum.photos/id/1069/800/600" alt="Hình 6"></div><figcaption>Hình 6 — Biển chiều</figcaption></figure>
  </div>
</body>
</html>
